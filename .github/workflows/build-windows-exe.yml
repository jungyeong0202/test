name: build-windows-exe

# 실제 윈도우에서 .NET Framework 컴파일러로 exe 를 빌드해 첨부한다.
# Actions 탭 -> 최신 실행 -> Artifacts 에서 PokemonTaskbar.exe 를 내려받을 수 있다.
on:
  push:
    paths:
      - "csharp/**"
      - "assets/fonts/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PokemonTaskbar.exe
        shell: cmd
        run: |
          set "CSC=%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if not exist "%CSC%" set "CSC=%WINDIR%\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          "%CSC%" /nologo /target:winexe /optimize+ /win32icon:csharp\pokemon.ico ^
            /out:PokemonTaskbar.exe ^
            /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll ^
            /resource:assets\fonts\NotoSansKR-VF.ttf,PokemonTaskbar.NotoSansKR.ttf ^
            /resource:assets\fonts\OFL.txt,PokemonTaskbar.NotoSansKR.OFL.txt ^
            csharp\PokemonTaskbar.cs csharp\Sprites.cs

      - name: Check that it is a Windows GUI assembly
        shell: pwsh
        run: |
          $exe = Get-Item PokemonTaskbar.exe
          "size: $($exe.Length) bytes"
          [System.Reflection.AssemblyName]::GetAssemblyName($exe.FullName) | Format-List

      # 실제로 한 번 돌려 본다. 컴파일만 되고 윈도우에서 죽는 일이 있었다
      # (Mono 로 빌드하면 .NET Framework 에 없는 API 를 부르는 exe 가 나온다).
      - name: Smoke test - does it actually run?
        shell: pwsh
        run: |
          $log = "$env:APPDATA\PokemonTaskbar\startup.log"
          if (Test-Path $log) { Remove-Item $log }
          $run = Start-Process -FilePath .\PokemonTaskbar.exe -ArgumentList '--check' -Wait -PassThru
          "exit code: $($run.ExitCode)"
          if (-not (Test-Path $log)) { throw "시작 기록이 아예 없습니다. 실행되지 못했습니다." }
          Get-Content $log
          if ($run.ExitCode -ne 0) { throw "0 이 아닌 종료 코드: $($run.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern '그림과 계산은 정상' -Quiet)) {
            throw "자체 점검이 끝까지 가지 못했습니다."
          }
          if (Select-String -Path $log -Pattern '!! 실패' -Quiet) { throw "기록에 실패가 있습니다." }

      - uses: actions/upload-artifact@v4
        with:
          name: PokemonTaskbar-exe
          path: PokemonTaskbar.exe
          if-no-files-found: error
